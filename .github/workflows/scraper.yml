name: Raspagem Automática de Editais

on:
  schedule:
    # Roda todos os dias às 08:00, 16:00 e 23:00 (UTC)
    # Isso corresponde aproximadamente às 05:00, 13:00 e 20:00 no horário de Brasília (BRT)
    - cron: '0 8,16,23 * * *'
  # O workflow_dispatch permite que você ative a execução manualmente no GitHub
  workflow_dispatch: 

jobs:
  scrape-and-update:
    runs-on: self-hosted

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm' # Usa o cache do npm para deixar a pipeline mais rápida

      - name: Instalar dependências do sistema (Poppler pdftotext)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Instalar dependências
        run: npm ci

      - name: Executar scraper e atualizar banco de dados
        env:
          NODE_ENV: production
          # Injeta o token da Vercel nos processos do Node
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/run-scraper.ts
